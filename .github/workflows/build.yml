name: Build and Release APK
on:
  push:
    paths-ignore:
      - '**.md'
      - 'backend/**'
      - '.github/workflows/backend.yml'
      - 'backend/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm install @capacitor/app @capacitor/browser @capacitor-community/file-opener
      - run: npx cap sync android
      - name: Add install permission
        run: |
          sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|&\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />|' android/app/src/main/AndroidManifest.xml
          grep -c "REQUEST_INSTALL_PACKAGES" android/app/src/main/AndroidManifest.xml
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Patch gradle (version and signing)
        env:
          N: ${{ github.run_number }}
          KS: ${{ runner.temp }}/release.jks
        run: |
          python3 - <<'PY'
          import os
          p = "android/app/build.gradle"
          s = open(p, encoding="utf-8").read()
          n = os.environ["N"]
          s = s.replace('versionCode 1', 'versionCode ' + n)
          s = s.replace('versionName "1.0"', 'versionName "1.0.' + n + '"')
          sign = "\n".join([
              "    signingConfigs {",
              "        release {",
              "            storeFile file(System.getenv('KS'))",
              "            storePassword System.getenv('KEYSTORE_PASSWORD')",
              "            keyAlias System.getenv('KEY_ALIAS')",
              "            keyPassword System.getenv('KEY_PASSWORD')",
              "        }",
              "    }",
              "    buildTypes {",
              "        release {",
              "            signingConfig signingConfigs.release",
              ""])
          old = "    buildTypes {\n        release {\n"
          assert old in s
          s = s.replace(old, sign)
          open(p, "w", encoding="utf-8").write(s)
          PY
      - name: Build release APK
        env:
          KS: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: chmod +x android/gradlew && cd android && ./gradlew assembleRelease -x lintVitalRelease -x lintVitalAnalyzeRelease
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk xiaozhangben.apk
          gh release create "v${{ github.run_number }}" xiaozhangben.apk --title "v${{ github.run_number }}" --notes "${MSG:-更新}"
