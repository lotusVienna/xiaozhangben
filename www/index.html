<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>小账本</title>
<meta name="theme-color" content="#24483a">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f3f5f1;--card:#fff;--ink:#1d2a24;--mute:#6b7a72;--line:#dfe5e0;--in:#1f7a4d;--out:#c0452f;--acc:#24483a;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121815;--card:#1b241f;--ink:#e8efe9;--mute:#93a39a;--line:#2b3830;--in:#5fcf97;--out:#ff8c76;--acc:#5fcf97;--on:#10231a}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif}
body{max-width:560px;margin:0 auto;padding:16px 16px 96px}
.top{display:flex;align-items:center;justify-content:space-between}
.top button{background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;width:40px;height:40px;font-size:18px}
.top h1{font-size:18px;margin:0}
.sum{background:var(--acc);color:var(--on);border-radius:16px;padding:18px;margin:14px 0}
.sum .bal{font-size:32px;font-weight:700;margin:2px 0 12px}
.sum .row{display:flex;gap:24px;font-size:14px;opacity:.92}
.day{font-size:13px;color:var(--mute);margin:18px 4px 6px;display:flex;justify-content:space-between}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:6px;width:100%;text-align:left;color:var(--ink);font:inherit}
.item .c{flex:1;min-width:0}.item .n{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:700;font-variant-numeric:tabular-nums}.amt.in{color:var(--in)}.amt.out{color:var(--out)}
.empty{text-align:center;color:var(--mute);padding:48px 0}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--acc);color:var(--on);border:0;border-radius:28px;height:56px;padding:0 24px;font-size:16px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.bar{display:flex;gap:8px;margin-top:6px}
.bar button{flex:1;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;height:40px;font:inherit;font-size:14px}
.sg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sg button{flex:1;height:40px;border:0;background:none;color:var(--ink);font:inherit}
.sg button.on{background:var(--acc);color:var(--on)}
.bl .r{margin:9px 0}.bl .h{display:flex;justify-content:space-between;font-size:14px}.bl .b{height:6px;background:var(--line);border-radius:3px;margin-top:4px}.bl .b i{display:block;height:100%;border-radius:3px}
.sh{font-size:13px;color:var(--mute);margin:16px 0 2px}
.yt{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}.yt td,.yt th{padding:8px 4px;text-align:right;border-bottom:1px solid var(--line)}.yt th:first-child,.yt td:first-child{text-align:left}.yt th{color:var(--mute);font-weight:400}.yt tr.cl{cursor:pointer}
dialog{max-height:88vh;overflow:auto}
dialog{border:0;border-radius:18px;padding:18px;width:min(92vw,520px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.seg button{flex:1;height:40px;border:0;background:none;color:var(--ink);font:inherit}
.seg button.on{background:var(--acc);color:var(--on)}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:0 12px;font:inherit;font-size:16px}
#amount{font-size:26px;font-weight:700}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:20px;padding:8px 12px;font:inherit;font-size:14px}
.cats button.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
.act{display:flex;gap:8px;margin-top:16px}
.act button{flex:1;height:46px;border-radius:12px;border:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-weight:700}
.act .ok{background:var(--acc);color:var(--on);border-color:var(--acc)}.act .del{color:var(--out)}
</style>
</head>
<body>
<input id="q" type="search" placeholder="搜索备注、分类、方式、金额" style="margin-bottom:12px">
<div class="top"><button id="prev" aria-label="上个月">‹</button><h1 id="mt"></h1><button id="next" aria-label="下个月">›</button></div>
<div class="cats" id="curtabs" style="margin-top:12px"></div>
<div class="sum"><div style="font-size:13px;opacity:.85">本月结余</div><div class="bal" id="bal"></div>
<div class="row"><span id="inc"></span><span id="exp"></span></div></div>
<div id="list"></div>
<div class="bar"><button id="sum-btn">月度汇总</button><button id="exp-csv">导出 CSV</button><button id="imp-btn">导入 CSV</button></div>
<div class="bar"><button id="acct-btn">账号与同步</button><button id="upd-btn">检查更新</button></div>
<div id="syncst" style="text-align:center;font-size:12px;color:var(--mute);margin-top:10px"></div>
<div id="ver" style="text-align:center;font-size:12px;color:var(--mute);margin-top:10px"></div>
<input type="file" id="imp" accept=".csv,text/csv" hidden>
<button class="fab" id="add">+ 记一笔</button>

<dialog id="adlg">
<div style="font-weight:700;font-size:17px;margin-bottom:6px">账号与同步</div>
<div id="a-out">
 <div style="font-size:13px;color:var(--mute);margin-bottom:8px">用邮箱登录后，账目会同步到云端，可在多台设备上使用，换手机也不会丢。本机现有账目会在登录后上传。</div>
 <label>邮箱</label><input id="a-email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com">
 <div id="a-codebox" hidden><label>验证码（6 位）</label><input id="a-code" type="text" inputmode="numeric" maxlength="6" placeholder="123456"></div>
 <div class="act"><button class="ok" id="a-send">获取验证码</button><button class="ok" id="a-login" hidden>登录</button></div>
</div>
<div id="a-in" hidden>
 <div id="a-who" style="font-weight:700;margin:8px 0 2px"></div>
 <div id="a-state" style="font-size:13px;color:var(--mute)"></div>
 <div class="act"><button class="ok" id="a-now">立即同步</button><button id="a-logout">退出登录</button></div>
 <button id="a-del" style="margin-top:14px;width:100%;height:40px;border:1px solid var(--line);border-radius:10px;background:none;color:var(--out);font:inherit">删除云端账号和数据</button>
</div>
<div id="a-msg" style="font-size:13px;margin-top:10px;min-height:18px;color:var(--mute)"></div>
<div class="act"><button id="a-close">关闭</button></div>
</dialog>

<dialog id="sdlg">
<div class="sg"><button data-m="m" class="on">按月</button><button data-m="y">按年</button></div>
<div id="stitle" style="font-weight:700;margin:12px 0 4px"></div><div id="sbody"></div>
<div class="act"><button class="ok" id="sclose">关闭</button></div></dialog>

<dialog id="dlg">
<div class="seg"><button data-t="out" class="on">支出</button><button data-t="in">收入</button></div>
<input id="amount" type="number" inputmode="decimal" step="0.01" placeholder="0.00">
<div id="hamt"></div>
<div class="cats" id="curs" style="margin-top:8px"></div>
<label>分类</label><div class="cats" id="cats"></div>
<label id="paylbl">支付方式</label><div class="cats" id="pays"></div>
<div style="font-size:12px;color:var(--mute);margin-top:6px">长按自定义的分类或方式可删除</div>
<label>日期</label><input id="date" type="date">
<label>备注</label><input id="note" type="text" placeholder="选填">
<div id="hnote"></div>
<div class="act"><button class="del" id="del" hidden>删除</button><button id="cancel">取消</button><button class="ok" id="save">保存</button></div>
</dialog>

<script>
const BASE={out:["餐饮","交通","购物","居家","娱乐","医疗","学习","其他"],in:["工资","奖金","兑换","其他"]};
let custom={out:[],in:[]};
try{const c=JSON.parse(localStorage.getItem("ledger_cats")||"null");if(c&&c.out&&c.in)custom=c}catch(e){}
const saveCats=()=>{try{localStorage.setItem("ledger_cats",JSON.stringify(custom))}catch(e){}S.setAt=Date.now();saveS();scheduleSync()};
const BASEPAY=["刷卡","转账","现金"];let customPay=[];
try{const c=JSON.parse(localStorage.getItem("ledger_pay")||"null");if(Array.isArray(c))customPay=c}catch(e){}
const savePay=()=>{try{localStorage.setItem("ledger_pay",JSON.stringify(customPay))}catch(e){}S.setAt=Date.now();saveS();scheduleSync()};
const allPay=()=>BASEPAY.concat(customPay);let pay="刷卡",lastPay="刷卡";
const allCats=t=>BASE[t].concat(custom[t]);
const CUR={EUR:"€",USD:"$",CNY:"CN¥",GBP:"£",JPY:"JP¥",HKD:"HK$",CHF:"CHF "};
let cur="EUR",lastCur="EUR",viewCur="EUR";
const curOf=r=>CUR[r.cur]?r.cur:"EUR";
let data=[],ym=new Date().toISOString().slice(0,7),type="out",cat="",editId=null;
const $=id=>document.getElementById(id);
function load(){try{data=JSON.parse(localStorage.getItem("ledger")||"[]")}catch(e){data=[]}}
function persistRaw(){try{localStorage.setItem("ledger",JSON.stringify(data))}catch(e){alert("无法保存：浏览器禁止了本地存储")}}
function persist(){persistRaw();scheduleSync()}
const newId=()=>Date.now()*1000+Math.floor(Math.random()*1000);
const fmt=n=>n.toLocaleString("zh-CN",{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
function renderSearch(qv){
 const terms=qv.split(/\s+/);
 const L=data.filter(r=>{const h=[r.cat,r.pay||"",r.note||"",String(r.amount),curOf(r),r.date,r.type==="in"?"收入":"支出"].join(" ").toLowerCase();return terms.every(t=>h.includes(t))}).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
 const el=$("list");el.textContent="";
 if(!L.length){el.innerHTML='<div class="empty">没有找到相关记录</div>';return}
 const tot={};L.forEach(r=>{const c=curOf(r);tot[c]=tot[c]||{in:0,out:0};tot[c][r.type]+=r.amount});
 const s=document.createElement("div");s.className="day";s.style.display="block";
 s.textContent="共 "+L.length+" 条 · "+Object.keys(tot).map(c=>c+" 收入 "+fmt(tot[c].in)+" 支出 "+fmt(tot[c].out)).join("；");el.append(s);
 let last="";
 L.forEach(r=>{
  if(r.date!==last){last=r.date;const h=document.createElement("div");h.className="day";h.textContent=r.date;el.append(h)}
  const b=document.createElement("button");b.className="item";
  b.innerHTML='<div class="c"><div></div><div class="n"></div></div><div class="amt '+r.type+'"></div>';
  b.querySelector(".c div").textContent=r.cat;b.querySelector(".n").textContent=[r.pay,r.note].filter(Boolean).join(" · ");
  b.querySelector(".amt").textContent=(r.type==="in"?"+":"-")+CUR[curOf(r)]+fmt(r.amount);
  b.onclick=()=>openDlg(r);el.append(b)});
}
function render(){
 const qv=$("q").value.trim().toLowerCase();
 document.querySelector(".top").style.display=document.querySelector(".sum").style.display=qv?"none":"";
 if(qv){$("curtabs").textContent="";renderSearch(qv);return}
 const [y,m]=ym.split("-");$("mt").textContent=y+" 年 "+Number(m)+" 月";
 const M=data.filter(r=>r.date.startsWith(ym));
 const present=[...new Set(M.map(curOf))];
 const tabs=present.length?present:[viewCur];
 if(!tabs.includes(viewCur))viewCur=tabs[0];
 const tb=$("curtabs");tb.textContent="";
 if(tabs.length>1)tabs.forEach(c=>{const b=document.createElement("button");b.textContent=c;b.className=c===viewCur?"on":"";b.onclick=()=>{viewCur=c;render()};tb.append(b)});
 const mny=n=>CUR[viewCur]+fmt(n);
 const L=M.filter(r=>curOf(r)===viewCur).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
 const inc=L.filter(r=>r.type==="in").reduce((s,r)=>s+r.amount,0),exp=L.filter(r=>r.type==="out").reduce((s,r)=>s+r.amount,0);
 $("bal").textContent=mny(inc-exp);$("inc").textContent="收入 "+mny(inc);$("exp").textContent="支出 "+mny(exp);
 const el=$("list");el.textContent="";
 if(!L.length){el.innerHTML='<div class="empty">这个月还没有记录<br>点右下角「记一笔」开始</div>';return}
 let last="";
 L.forEach(r=>{
  if(r.date!==last){last=r.date;const dt=L.filter(x=>x.date===r.date);const net=dt.reduce((s,x)=>s+(x.type==="in"?x.amount:-x.amount),0);
   const h=document.createElement("div");h.className="day";h.innerHTML="<span>"+r.date.slice(5).replace("-","月")+"日</span><span>"+mny(net)+"</span>";el.append(h)}
  const b=document.createElement("button");b.className="item";
  b.innerHTML='<div class="c"><div></div><div class="n"></div></div><div class="amt '+r.type+'"></div>';
  b.querySelector(".c div").textContent=r.cat;b.querySelector(".n").textContent=[r.pay,r.note].filter(Boolean).join(" · ");
  b.querySelector(".amt").textContent=(r.type==="in"?"+":"-")+mny(r.amount);
  b.onclick=()=>openDlg(r);el.append(b)});
}
function drawCurs(){const c=$("curs");c.textContent="";Object.keys(CUR).forEach(k=>{const b=document.createElement("button");b.textContent=k;b.className=k===cur?"on":"";b.onclick=()=>{cur=k;drawCurs()};c.append(b)})}
function setType(t){type=t;document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
 if(!allCats(t).includes(cat))cat=allCats(t)[0];$("paylbl").textContent=t==="in"?"收款方式":"支付方式";drawCats();drawPays()}
function drawCats(){const c=$("cats");c.textContent="";
 allCats(type).forEach(n=>{const b=document.createElement("button");b.textContent=n;b.className=n===cat?"on":"";
  b.onclick=()=>{cat=n;drawCats()};
  if(custom[type].includes(n)){let tm;const del=()=>{if(confirm("删除自定义分类「"+n+"」？\n已有记录不受影响。")){custom[type]=custom[type].filter(x=>x!==n);saveCats();if(cat===n)cat=BASE[type][0];drawCats()}};
   b.addEventListener("touchstart",()=>{tm=setTimeout(del,700)},{passive:true});["touchend","touchmove","touchcancel"].forEach(ev=>b.addEventListener(ev,()=>clearTimeout(tm),{passive:true}));
   b.oncontextmenu=e=>{e.preventDefault();del()}}
  c.append(b)});
 const add=document.createElement("button");add.textContent="+ 自定义";add.style.borderStyle="dashed";
 add.onclick=()=>{const v=(prompt("新分类名称")||"").trim().slice(0,8);if(!v)return;
  if(allCats(type).includes(v)){cat=v;drawCats();return}
  custom[type].push(v);saveCats();cat=v;drawCats()};
 c.append(add);drawHist()}
function drawHist(){
 const L=data.filter(r=>r.type===type&&r.cat===cat&&r.id!==editId).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
 const am={},nt={};
 L.forEach(r=>{const c=curOf(r),k=c+"|"+r.amount;(am[k]=am[k]||{c,v:r.amount,n:0}).n++;if(r.note)(nt[r.note]=nt[r.note]||{t:r.note,n:0}).n++});
 const sorted=o=>Object.values(o).sort((a,b)=>b.n-a.n).slice(0,6);
 const fill=(id,label,items,txt,fn)=>{const box=$(id);box.textContent="";if(!items.length)return;
  const l=document.createElement("div");l.textContent=label;l.style.cssText="font-size:12px;color:var(--mute);margin:8px 0 4px";
  const w=document.createElement("div");w.className="cats";
  items.forEach(it=>{const b=document.createElement("button");b.textContent=txt(it);b.onclick=()=>fn(it);w.append(b)});
  box.append(l,w)};
 fill("hamt","「"+cat+"」常用金额",sorted(am),it=>CUR[it.c]+fmt(it.v),it=>{$("amount").value=it.v;cur=it.c;drawCurs()});
 fill("hnote","「"+cat+"」历史备注",sorted(nt),it=>it.t,it=>{$("note").value=it.t})}
function drawPays(){const c=$("pays");c.textContent="";
 allPay().forEach(n=>{const b=document.createElement("button");b.textContent=n;b.className=n===pay?"on":"";
  b.onclick=()=>{pay=n;drawPays()};
  if(customPay.includes(n)){let tm;const del=()=>{if(confirm("删除自定义方式「"+n+"」？\n已有记录不受影响。")){customPay=customPay.filter(x=>x!==n);savePay();if(pay===n)pay=BASEPAY[0];drawPays()}};
   b.addEventListener("touchstart",()=>{tm=setTimeout(del,700)},{passive:true});["touchend","touchmove","touchcancel"].forEach(ev=>b.addEventListener(ev,()=>clearTimeout(tm),{passive:true}));
   b.oncontextmenu=e=>{e.preventDefault();del()}}
  c.append(b)});
 const add=document.createElement("button");add.textContent="+ 添加";add.style.borderStyle="dashed";
 add.onclick=()=>{const v=(prompt("新方式名称（如 支付宝、微信）")||"").trim().slice(0,8);if(!v)return;
  if(!allPay().includes(v)){customPay.push(v);savePay()}pay=v;drawPays()};
 c.append(add)}
function openDlg(r){editId=r?r.id:null;cat=r?r.cat:"";pay=r?(r.pay||lastPay):lastPay;cur=r?curOf(r):lastCur;setType(r?r.type:"out");
 $("amount").value=r?r.amount:"";$("date").value=r?r.date:today();$("note").value=r?r.note:"";$("del").hidden=!r;drawCurs();$("dlg").showModal();if(!r)$("amount").focus()}
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>setType(b.dataset.t));
$("add").onclick=()=>openDlg();$("cancel").onclick=()=>$("dlg").close();
$("save").onclick=()=>{const a=parseFloat($("amount").value);if(!(a>0)){$("amount").focus();return}
 const rec={id:editId||newId(),updated_at:Date.now(),type,amount:Math.round(a*100)/100,cat,pay,cur,date:$("date").value||today(),note:$("note").value.trim()};
 if(editId)data=data.map(r=>r.id===editId?rec:r);else data.push(rec);
 lastPay=pay;lastCur=cur;viewCur=cur;persist();ensureHist();ym=rec.date.slice(0,7);$("dlg").close();render()};
$("del").onclick=()=>{if(confirm("删除这条记录？")){tomb=tomb.filter(t=>t.id!==editId);tomb.push({id:editId,updated_at:Date.now()});saveT();data=data.filter(r=>r.id!==editId);persist();$("dlg").close();render()}};
function shift(d){const [y,m]=ym.split("-").map(Number);const t=new Date(y,m-1+d,1);ym=t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0");render()}
$("prev").onclick=()=>shift(-1);$("next").onclick=()=>shift(1);
const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
$("exp-csv").onclick=async()=>{if(!data.length){alert("还没有数据可导出");return}
 const rows=["日期,类型,分类,方式,货币,金额,备注"].concat([...data].sort((a,b)=>a.date.localeCompare(b.date)).map(r=>[r.date,r.type==="in"?"收入":"支出",q(r.cat),q(r.pay||""),curOf(r),r.amount,q(r.note)].join(",")));
 const text="\ufeff"+rows.join("\n"),name="小账本-"+today()+".csv";
 const P=window.Capacitor&&Capacitor.Plugins;
 if(P&&P.Filesystem&&P.Share){
  try{const w=await P.Filesystem.writeFile({path:name,data:text,directory:"CACHE",encoding:"utf8"});
   await P.Share.share({title:name,url:w.uri,dialogTitle:"保存或发送备份"})}catch(e){if(!/cancel/i.test(String(e)))alert("导出失败："+e)}
  return}
 const blob=new Blob([text],{type:"text/csv;charset=utf-8"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove()};
function parseCSV(t){const out=[];let row=[],f="",inq=false;for(let i=0;i<t.length;i++){const c=t[i];
 if(inq){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else inq=false}else f+=c}
 else if(c==='"')inq=true;else if(c===","){row.push(f);f=""}else if(c==="\n"){row.push(f);out.push(row);row=[];f=""}else if(c!=="\r")f+=c}
 if(f||row.length){row.push(f);out.push(row)}return out}
$("imp-btn").onclick=()=>$("imp").click();
$("imp").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{
 const rows=parseCSV(String(r.result).replace(/^\ufeff/,"")).slice(1).filter(x=>x.length>=5&&/^\d{4}-\d{2}-\d{2}$/.test(x[0]));
 if(!rows.length){alert("没有识别到有效记录，请使用本软件导出的 CSV");return}
 if(!confirm("导入 "+rows.length+" 条记录并与现有数据合并？"))return;
 rows.forEach((x,i)=>{const n7=x.length>=7,n6=x.length>=6;

 try{

  const setDirty=(S.setAt||0)>(S.setPushed||0);
  const setObj=setDirty?{data:{custom,customPay},updated_at:S.setAt}:null;
  for(let i=0;i<Math.max(1,Math.ceil(items.length/100));i++){
   const chunk=items.slice(i*100,i*100+100);
   if(!chunk.length&&!(i===0&&setObj))break;
   await api("/sync",{records:chunk,settings:i===0?setObj:undefined})}
  if(setObj)S.setPushed=S.setAt;
  const ids=new Set(tsent.map(t=>t.id));tomb=tomb.filter(t=>!ids.has(t.id));saveT();
